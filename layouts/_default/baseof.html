<!DOCTYPE html>
<html {{- with site.Language.Locale }} lang="{{ . }}" {{- end }}>
  <head>
    <script>
      // Follow the OS colour scheme; DocSearch and Bulma both key off [data-theme]
      (function () {
        var query = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () { document.documentElement.setAttribute("data-theme", query.matches ? "dark" : "light"); };
        apply();
        query.addEventListener("change", apply);
      })();
    </script>
    {{ partial "meta.html" . }}
    <title>
      {{- block "title" . -}}
        {{ .Title }} | {{ site.Title -}}
      {{ end -}}
    </title>
    {{ partial "css.html" . }}
    {{ partial "favicon.html" . }}
  </head>
  <body class="is-page has-navbar-fixed-top">
    <main class="is-main">
      {{ partial "navbar.html" . }}
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "javascript.html" . }}
  </body>
</html>
